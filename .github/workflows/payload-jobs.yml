name: Payload Jobs

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    name: Drain job queue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run queued Payload jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set; scheduled publishing will not run."
            exit 1
          fi

          status=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
            --max-time 120 --retry 2 --retry-delay 10 --retry-connrefused \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://beyondai.africa/api/payload-jobs/run")

          echo "HTTP $status"
          head -c 2000 /tmp/body.txt

          if [ "$status" -ge 400 ]; then
            echo "::error::Job run failed with HTTP $status"
            exit 1
          fi
